name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  backend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit tools
        run: pip install pip-audit bandit
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Static security scan
        run: bandit -r . -x "./tests,./alembic" --severity-level high

  frontend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t cu002-backend:scan -f backend/Dockerfile.backend backend
      - name: Build worker image
        run: docker build -t cu002-worker:scan -f backend/Dockerfile.worker backend
      - name: Build frontend image
        run: docker build -t cu002-frontend:scan -f frontend/Dockerfile frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: cu002-backend:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Scan worker image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: cu002-worker:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: cu002-frontend:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
