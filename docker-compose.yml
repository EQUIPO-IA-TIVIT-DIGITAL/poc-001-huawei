services:
  tivit-vision-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: tivit-vision-backend-orig
    image: tivit-vision-backend-orig:1.0.0
    ports:
      - "5002:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REQUIRE_ASYNC_QUEUE=${REQUIRE_ASYNC_QUEUE:-true}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - PYTHONUNBUFFERED=1
      - STORAGE_BACKEND=filesystem
      - DB_BACKEND=sqlite
      - AI_PROVIDER=disabled
      # Redis Queue
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:5002}
    volumes:
      - ./backend/config:/app/config:ro
      - uploads:/app/uploads
      - thumbnails:/app/thumbnails
      - ./backend:/app
    networks:
      - tivit-vision-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "1000:1000"

  tivit-vision-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: tivit-vision-frontend-orig
    image: tivit-vision-frontend-orig:dev
    ports:
      - "5174:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5002
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - tivit-vision-network
    restart: unless-stopped
    depends_on:
      tivit-vision-backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: tivit-vision-redis-orig
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - tivit-vision-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD --no-auth-warning ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    image: tivit-vision-worker-orig:1.0.0
    command: python worker.py
    depends_on:
      redis:
        condition: service_healthy
      tivit-vision-backend:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      - REQUIRE_ASYNC_QUEUE=${REQUIRE_ASYNC_QUEUE:-true}
      - PYTHONUNBUFFERED=1
      - STORAGE_BACKEND=filesystem
      - DB_BACKEND=sqlite
      - AI_PROVIDER=disabled
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      - thumbnails:/app/thumbnails
    networks:
      - tivit-vision-network
    user: "1000:1000"
    restart: unless-stopped

networks:
  tivit-vision-network:
    driver: bridge

volumes:
  uploads:
  thumbnails:
  redis_data:
