# CU002 Local Offline 32B — 9 servicios (Postgres+MinIO+vLLM 32B) + observabilidad
# Uso: cp .env.example .env && docker compose -f docker-compose.local.yml up -d --build
# Modelos: pre-pull offline via backend/scripts/pull_models.sh (Qwen2.5-VL-32B-AWQ, Qwen2.5-32B-AWQ, bge-m3, whisper turbo)
name: cu002-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cu002-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cu002}
      POSTGRES_USER: ${POSTGRES_USER:-cu002}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cu002} -d ${POSTGRES_DB:-cu002}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [cu002-network]
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:1.23.0
    container_name: cu002-pgbouncer
    profiles: [pool]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-cu002}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}@postgres:5432/${POSTGRES_DB:-cu002}"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6439 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [cu002-network]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: cu002-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER requerido}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requerido}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [cu002-network]
    restart: unless-stopped

  minio-setup:
    image: minio/mc:RELEASE.2024-12-18T16-47-23Z
    profiles: [setup]
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER requerido}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requerido}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:?MINIO_ROOT_USER requerido} $${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requerido} &&
      mc mb -p local/cu002-videos 2>/dev/null || true &&
      mc mb -p local/cu002-thumbs 2>/dev/null || true &&
      mc ilm add --expiry-days 7 local/cu002-videos --prefix 'tmp/' 2>/dev/null || true &&
      echo 'MinIO buckets ready';
      "
    networks: [cu002-network]

  redis:
    image: redis:7-alpine
    container_name: cu002-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD requerido}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD requerido}
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:?REDIS_PASSWORD requerido} --no-auth-warning ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [cu002-network]
    restart: unless-stopped

  # vLLM Vision 32B (Qwen2.5-VL-32B-AWQ, TP4, 20GB AWQ) — profile gpu (offline)
  # Clone limpio sin GPU: docker compose -f docker-compose.local.yml up -d (sin --profile gpu) levanta solo backend/postgres/minio/redis
  vllm-vision:
    image: vllm/vllm-openai:v0.6.2
    container_name: cu002-vllm-vision
    profiles: [gpu]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0,1,2,3
      - VLLM_ATTENTION_BACKEND=FLASH_ATTN_V100
      - HF_HUB_OFFLINE=1
    volumes:
      - models:/models
      - hf_cache:/root/.cache/huggingface
    command: >
      --model /models/Qwen2.5-VL-32B-Instruct-AWQ
      --served-model-name Qwen/Qwen2.5-VL-32B-Instruct-AWQ
      --tensor-parallel-size 4
      --max-model-len 8192
      --gpu-memory-utilization 0.92
      --limit-mm-per-prompt image=4
      --quantization awq
      --host 0.0.0.0 --port 8000
      --trust-remote-code
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks: [cu002-network]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 4, capabilities: [gpu] }]

  # vLLM Text 32B (Qwen2.5-32B-AWQ, TP4) — profile gpu
  vllm-text:
    image: vllm/vllm-openai:v0.6.2
    container_name: cu002-vllm-text
    profiles: [gpu]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=4,5,6,7
      - HF_HUB_OFFLINE=1
    volumes:
      - models:/models
      - hf_cache:/root/.cache/huggingface
    command: >
      --model /models/Qwen2.5-32B-Instruct-AWQ
      --served-model-name Qwen/Qwen2.5-32B-Instruct-AWQ
      --tensor-parallel-size 4
      --max-model-len 8192
      --gpu-memory-utilization 0.92
      --quantization awq
      --host 0.0.0.0 --port 8000
      --trust-remote-code
    ports: ["8002:8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks: [cu002-network]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 4, capabilities: [gpu] }]

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.7.0
    container_name: cu002-whisper
    profiles: [gpu]
    environment:
      - ASR_MODEL=large-v3-turbo
      - ASR_ENGINE=faster_whisper
    ports: ["8001:9000"]
    volumes: [whisper_models:/root/.cache/huggingface]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || wget -qO- http://localhost:9000/ | grep -q html"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [cu002-network]
    restart: unless-stopped

  backend:
    build: { context: ./backend, dockerfile: Dockerfile.backend }
    container_name: cu002-backend
    image: cu002-backend:local
    ports: ["127.0.0.1:5001:5000"]
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - APP_ENV=local
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY requerido}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-cu002}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}@postgres:5432/${POSTGRES_DB:-cu002}
      - PGVECTOR_ENABLED=true
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD requerido}@redis:6379/0
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-cu002-videos}
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER requerido}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requerido}
      - S3_REGION=us-east-1
      - S3_USE_SSL=false
      - AI_PROVIDER=${AI_PROVIDER:-hybrid}
      - AI_API_PROVIDER=${AI_API_PROVIDER:-openrouter}
      - AI_API_BASE_URL=${AI_API_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_TEXT_MODEL=${AI_API_TEXT_MODEL:-qwen/qwen-2.5-72b-instruct}
      - AI_API_VISION_MODEL=${AI_API_VISION_MODEL:-qwen/qwen-2.5-vl-72b-instruct}
      - AI_API_EMBEDDING_MODEL=${AI_API_EMBEDDING_MODEL:-}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-http://localhost:5173}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-TIVIT CU002}
      - AI_LOCAL_BASE_URL=http://vllm-vision:8000/v1
      - AI_LOCAL_MODEL=Qwen/Qwen2.5-VL-32B-Instruct-AWQ
      - AI_LOCAL_TEXT_BASE_URL=http://vllm-text:8000/v1
      - AI_LOCAL_TEXT_MODEL=Qwen/Qwen2.5-32B-Instruct-AWQ
      - AI_LOCAL_EMBEDDING_MODEL=BAAI/bge-m3
      - WHISPER_BASE_URL=http://whisper:9000
      - WHISPER_MODEL=large-v3-turbo
      - VLLM_TENSOR_PARALLEL_SIZE=4
      - PYTHONUNBUFFERED=1
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174}
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      - thumbnails:/app/thumbnails
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [cu002-network]
    restart: unless-stopped
    user: "1000:1000"

  worker:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    container_name: cu002-worker
    image: cu002-worker:local
    command: python worker.py
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; r=redis.Redis.from_url('redis://:'+__import__('os').environ.get('REDIS_PASSWORD','')+'@redis:6379/0'); r.ping()\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-cu002}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}@postgres:5432/${POSTGRES_DB:-cu002}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD requerido}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD requerido}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-cu002-videos}
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER requerido}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requerido}
      - S3_REGION=us-east-1
      - AI_PROVIDER=${AI_PROVIDER:-hybrid}
      - AI_API_PROVIDER=${AI_API_PROVIDER:-openrouter}
      - AI_API_BASE_URL=${AI_API_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_TEXT_MODEL=${AI_API_TEXT_MODEL:-qwen/qwen-2.5-72b-instruct}
      - AI_API_VISION_MODEL=${AI_API_VISION_MODEL:-qwen/qwen-2.5-vl-72b-instruct}
      - AI_API_EMBEDDING_MODEL=${AI_API_EMBEDDING_MODEL:-}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-http://localhost:5173}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-TIVIT CU002}
      - AI_LOCAL_BASE_URL=http://vllm-vision:8000/v1
      - AI_LOCAL_TEXT_BASE_URL=http://vllm-text:8000/v1
      - WHISPER_BASE_URL=http://whisper:9000
      - PYTHONUNBUFFERED=1
    volumes: [./backend:/app, uploads:/app/uploads, thumbnails:/app/thumbnails, models:/models:ro]
    depends_on:
      backend: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [cu002-network]
    restart: unless-stopped
    user: "1000:1000"
    deploy:
      replicas: 1

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile, args: { VITE_API_BASE_URL: "" } }
    container_name: cu002-frontend
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ | grep -q '<title'"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks: [cu002-network]
    restart: unless-stopped

networks:
  cu002-network: { driver: bridge }

volumes:
  pgdata:
  minio_data:
  redis_data:
  uploads:
  thumbnails:
  models:
  hf_cache:
  whisper_models:
